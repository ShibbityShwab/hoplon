version: 2
updates:
  # Keep the pinned workflow actions current. The workflows pin full commit
  # SHAs, so Dependabot bumps both the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: scope
    labels:
      - dependencies
      - github-actions

  # Python is intentionally not tracked: the vendored helper scripts are
  # standard-library only and ship no requirements or pyproject manifest.
