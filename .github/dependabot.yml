version: 2
updates:
  # Keep the pinned workflow actions current. The workflows pin full commit
  # SHAs, so Dependabot bumps both the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: scope
    labels:
      - dependencies
      - github-actions

  # Python helper scripts live under skills/*/scripts. The wildcard is resolved
  # by the directories key, which supports globbing. home/ is ignored by
  # .gitignore and is never scanned.
  - package-ecosystem: pip
    directories:
      - "/skills/*/scripts"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: scope
    labels:
      - dependencies
      - python
