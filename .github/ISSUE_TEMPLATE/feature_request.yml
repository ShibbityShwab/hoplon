name: Feature request
description: Propose a new capability or a change to Hoplon.
title: "[Feature]: "
labels:
  - enhancement
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the change you have in mind. Open an
        issue before large work so the design can be agreed on.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: This proposal does not weaken the rules-of-engagement gate.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should Hoplon do instead? Be as concrete as you can.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Launcher and isolation
        - QEMU VM guest
        - Agents and skills
        - Configuration
        - Documentation
        - Tooling and CI
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed and why you rejected them.
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Links, references, or prior art.
    validations:
      required: false
